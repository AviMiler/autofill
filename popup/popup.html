<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      width: 300px; min-height: 80px;
      background: #fff; color: #222;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #eee;
    }
    header h1 { font-size: 14px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .count { font-size: 11px; background: #4f7aff; color: #fff;
      border-radius: 10px; padding: 1px 7px; }
    #open-manager {
      font-size: 11px; padding: 3px 10px; border-radius: 5px;
      border: 1px solid #4f7aff; background: #fff; color: #4f7aff;
      cursor: pointer; font-family: inherit;
    }
    #open-manager:hover { background: #f0f4ff; }
    .cred-header { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
    #entries-list { padding: 8px 0; max-height: 300px; overflow-y: auto; }
    .af-group-title {
      font-size: 10px; color: #999; text-transform: uppercase;
      padding: 6px 16px 2px; letter-spacing: .5px;
    }
    .af-entry-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; cursor: default;
    }
    .af-entry-row:hover { background: #f5f5f5; }
    .af-entry-info { flex: 1; min-width: 0; }
    .af-entry-name { font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .af-entry-meta { font-size: 11px; color: #888; margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .af-toggle {
      position: relative; width: 32px; height: 18px; flex-shrink: 0;
    }
    .af-toggle input { opacity: 0; width: 0; height: 0; }
    .af-slider {
      position: absolute; inset: 0; background: #ccc;
      border-radius: 18px; cursor: pointer; transition: .2s;
    }
    .af-slider:before {
      content: ''; position: absolute;
      height: 13px; width: 13px; left: 2.5px; bottom: 2.5px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .af-slider { background: #4f7aff; }
    input:checked + .af-slider:before { transform: translateX(14px); }
    .af-del-btn {
      border: none; background: none; cursor: pointer;
      color: #ccc; font-size: 15px; padding: 2px 4px; line-height: 1;
    }
    .af-del-btn:hover { color: #c00; }
    footer {
      padding: 10px 16px; border-top: 1px solid #eee;
      font-size: 11px; color: #aaa; text-align: center;
    }
    .empty {
      padding: 24px 16px; text-align: center; color: #999; font-size: 13px;
    }
    #snippet-section { padding: 10px 16px 12px; border-bottom: 1px solid #eee; }
    #snippet-list { max-height: 120px; overflow-y: auto; margin-bottom: 8px; }
    .empty-small { font-size: 11px; color: #999; padding: 4px 0; }
    .snippet-row {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 0;
    }
    .snippet-info {
      flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px;
    }
    .snippet-trigger {
      font-size: 12px; font-weight: 600; font-family: ui-monospace, monospace;
      color: #4f7aff; flex-shrink: 0;
    }
    .snippet-value {
      font-size: 12px; color: #888;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .snippet-add-row { display: flex; gap: 5px; }
    .snippet-add-row input {
      padding: 5px 8px; font-size: 12px;
      border: 1px solid #ddd; border-radius: 5px; outline: none;
      font-family: inherit;
    }
    .snippet-add-row input:focus { border-color: #4f7aff; }
    #snip-trigger { width: 70px; flex-shrink: 0; }
    #snip-value { flex: 1; min-width: 0; }
    #snip-add {
      padding: 5px 12px; border-radius: 5px; border: 1px solid #4f7aff;
      background: #4f7aff; color: #fff; cursor: pointer; font-size: 13px;
      font-family: inherit; flex-shrink: 0;
    }
    #snip-add:hover { background: #3a66e0; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ AutoFill</h1>
    <div class="header-right">
      <button id="open-manager">🗂 ניהול</button>
      <span id="total-count" class="count">0</span>
    </div>
  </header>
  <div id="snippet-section">
    <div class="cred-header">✂️ קיצורי טקסט</div>
    <div id="snippet-list"></div>
    <div class="snippet-add-row">
      <input type="text" id="snip-trigger" placeholder="קיצור" dir="ltr" autocomplete="off">
      <input type="text" id="snip-value" placeholder="ערך למילוי" dir="ltr" autocomplete="off">
      <button id="snip-add">+</button>
    </div>
  </div>
  <div id="entries-list"></div>
  <footer>לחץ ימני על שדה כדי להוסיף מילוי</footer>
  <script src="popup.js"></script>
</body>
</html>
