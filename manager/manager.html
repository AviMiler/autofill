<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>ניהול AutoFill</title>
<link rel="stylesheet" href="manager.css">
</head>
<body>
  <div class="af-header">
    <div class="af-title">🗂 ניהול מילויים אוטומטיים</div>
    <input type="text" id="af-search" class="af-search" placeholder="🔍 חיפוש לפי שם, ערך, שדה או URL...">
    <div class="af-header-actions">
      <button class="af-btn" id="af-export" title="שמירת כל המילויים והקיצורים לקובץ">⬇ ייצוא</button>
      <button class="af-btn" id="af-import" title="טעינת קובץ גיבוי (ממזג, לא מוחק)">⬆ ייבוא</button>
      <input type="file" id="af-import-file" accept="application/json,.json" hidden>
    </div>
  </div>

  <div class="af-main">
    <details class="af-section" id="af-snippets-section">
      <summary>✂️ קיצורי טקסט <span class="af-section-count" id="af-snip-count"></span></summary>
      <div id="af-snippet-list"></div>
      <form class="af-snippet-add" id="af-snippet-form">
        <input type="text" id="af-snip-trigger" placeholder="קיצור (למשל @TZ)" dir="ltr" autocomplete="off">
        <input type="text" id="af-snip-value" placeholder="ערך למילוי" dir="ltr" autocomplete="off">
        <button type="submit" class="af-btn primary">+ הוסף</button>
      </form>
    </details>

    <div class="af-toolbar">
      <div class="af-chips" id="af-chips"></div>
      <span class="af-count" id="af-count"></span>
      <button class="af-btn primary af-add-btn" id="af-add-btn">+ הוסף מילוי חדש</button>
    </div>
    <div id="af-sel-filter"></div>
    <div id="af-new-slot"></div>
    <div class="af-body" id="af-body"></div>
  </div>

  <div class="af-toast-host" id="af-toast-host"></div>
  <script src="../content/storage.js"></script>
  <script src="dom.js"></script>
  <script src="entry-editor.js"></script>
  <script src="snippets.js"></script>
  <script src="backup.js"></script>
  <script src="manager.js"></script>
</body>
</html>
